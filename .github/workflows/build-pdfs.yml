name: Compile et publie les PDF

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  publish:
    uses: IUT-GEII-Annecy/ci-latex-upsti/.github/workflows/build-pdfs.yml@main
    with:
      site-title: "Supports Automatisme & Robotique - BUT GEII"
      site-subtitle: "Tous les supports de cours, td et tp du module Automatisme & Robotique - GEII IUT Annecy"
      group-label: "Module"
      classify-mode: documentclass
      exclude-patterns: |
        /03_DS/
        /evaluations/
        /Seq99_evaluation/
        /fichiers_etudiants/
    secrets: inherit
